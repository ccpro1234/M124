<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Quantum Predictor</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
:root{
--p:#38bdf8;
--b:#fb7185;
--t:#4ade80;
--panel:#0f172a;
}
body{
    margin:0;
    min-height:100vh;

   
    font-family:'Sarabun',sans-serif;
    color:#eef4ff;
    user-select:none;
    overflow-x:hidden;

    background:

        /* แสงม่วงด้านบน */
        radial-gradient(circle at 50% 0%,
            rgba(168,85,247,.22),
            transparent 35%),

        /* เขียวมรกตซ้าย */
        radial-gradient(circle at 15% 20%,
            rgba(16,185,129,.18),
            transparent 38%),

        /* ม่วงด้านขวา */
        radial-gradient(circle at 85% 15%,
            rgba(139,92,246,.18),
            transparent 36%),

        /* เขียวด้านล่าง */
        radial-gradient(circle at 50% 100%,
            rgba(34,197,94,.10),
            transparent 42%),

        /* แสงกลางจอ */
        radial-gradient(circle at center,
            rgba(255,255,255,.03),
            transparent 65%),

        /* พื้นหลังหลัก */
        linear-gradient(
            180deg,
            #231942 0%,
            #1c2440 25%,
            #153338 55%,
            #10252f 80%,
            #0a1721 100%
        );

    background-attachment:fixed;
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.025),
            transparent 30%,
            rgba(255,255,255,.015) 60%,
            transparent
        );

    mix-blend-mode:screen;
}
/* ===========================
   LOGIN PAGE
=========================== */
#loginPage{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
    box-sizing:border-box;
}

/* ===== BLINK ===== */
@keyframes glowBlink{
0%{box-shadow:0 0 0 rgba(250,204,21,0);transform:scale(1)}
50%{box-shadow:0 0 26px rgba(250,204,21,.95);transform:scale(1.2)}
100%{box-shadow:0 0 0 rgba(250,204,21,0);transform:scale(1)}
}

/* ===== LOGIN ===== */
.login{

    width:100%;
    max-width:380px;

    padding:30px;

    border-radius:24px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-sizing:border-box;
}

.login h3{
font-family:'Orbitron',sans-serif;
font-weight:800;
text-align:center;
letter-spacing:2px;
margin-bottom:20px;
}
.login input{
width:100%;
padding:12px;
border-radius:14px;
border:none;
background:#020617;
color:#fff;
margin-bottom:12px;
}
.login button{
width:100%;
padding:12px;
border-radius:16px;
border:none;
font-weight:900;
background:linear-gradient(135deg,#38bdf8,#6366f1);
color:#000;
}

/* ===== MAIN ===== */
/* ===== MAIN ===== */
.app{
    max-width:560px;
    margin:20px auto;
    padding:28px;
    border-radius:32px;

    position:relative;
    overflow:hidden;

    background:linear-gradient(
        180deg,
        rgba(36,43,72,.95) 0%,
        rgba(24,34,54,.97) 45%,
        rgba(14,22,36,.98) 100%
    );

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    /* ขอบ */
    border:1px solid rgba(255,255,255,.12);

    /* ขอบด้านใน */
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -1px 0 rgba(0,0,0,.35),

        /* เงาหลัก */
        0 18px 45px rgba(0,0,0,.55),

        /* Glow ม่วง */
        0 0 20px rgba(168,85,247,.18),

        /* Glow เขียว */
        0 0 16px rgba(16,185,129,.12);


    position:relative;
    overflow:hidden;
}

/* เอฟเฟกต์แสงบนพื้นผิว */
.app::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;

    border:1.5px solid rgba(255,255,255,.18);

    box-shadow:
        0 0 12px rgba(168,85,247,.20),
        0 0 8px rgba(16,185,129,.15);

    pointer-events:none;
}
@keyframes borderGlow{
    0%,100%{
        filter:drop-shadow(0 0 6px rgba(168,85,247,.20))
               drop-shadow(0 0 4px rgba(16,185,129,.15));
    }
    50%{
        filter:drop-shadow(0 0 14px rgba(168,85,247,.35))
               drop-shadow(0 0 10px rgba(16,185,129,.25));
    }
}

.app{
    animation:borderGlow 4s ease-in-out infinite;
}
/* ===== HEADER ===== */
.header{
    text-align:center;
    font-family:'Orbitron',sans-serif;
    font-size:15px;
    font-weight:900;
    letter-spacing:3px;
    line-height:1.4;
    margin-bottom:8px;

    background:linear-gradient(
        90deg,
        #ffffff 0%,
        #b8ecff 20%,
        #6ee7ff 50%,
        #38bdf8 80%,
        #60a5fa 100%
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;

    text-shadow:
        0 0 12px rgba(56,189,248,.45);

    user-select:none;
}

/* ===== SUB TITLE ===== */
.sub{
    text-align:center;
    font-size:.9rem;
    font-weight:500;
    letter-spacing:1px;
    color:#94a3b8;
    margin-bottom:14px;
    opacity:.9;
}

.expired{
color:#ef4444;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.acc{
text-align:center;
font-size:1.4rem;
font-weight:900;
margin-bottom:8px;
}
.acc span{color:#38bdf8}

/* ===== BIG BET ===== */
.advice{
    margin:18px auto;
    height:88px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:28px;

    font-family:'Orbitron',sans-serif;
    font-size:54px;
    font-weight:900;
    letter-spacing:8px;

    background:linear-gradient(
        180deg,
        rgba(255,255,255,.05),
        rgba(255,255,255,.02)
    );

    border:2px solid rgba(255,255,255,.08);

    box-shadow:
        inset 0 0 25px rgba(255,255,255,.03),
        0 12px 30px rgba(0,0,0,.45);

    transition:.3s;
}
.advice.p{

color:#6ee7ff;

border:2px solid #38bdf8;

box-shadow:

0 0 25px rgba(56,189,248,.7);

}

.advice.b{

color:#ff8ba0;

border:2px solid #fb7185;

box-shadow:

0 0 25px rgba(251,113,133,.7);

}

/* ===== STATS ===== */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin-bottom:12px;
}
.stats div{
background:var(--panel);
border-radius:14px;
padding:8px;
text-align:center;
font-weight:800;
}

/* ===== TABLE ===== */
table{
    border-collapse:separate;
    border-spacing:6px;
    margin:auto;
}

td{
    width:42px;
    height:42px;
    border-radius:14px;
    position:relative;
    text-align:center;
    font-weight:900;
    font-size:16px;

    background:linear-gradient(
        180deg,
        #132033 0%,
        #09111d 100%
    );

    border:1px solid rgba(255,255,255,.06);

    box-shadow:
        inset 0 0 10px rgba(255,255,255,.04),
        0 4px 10px rgba(0,0,0,.45);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

td:hover{
    transform:translateY(-2px) scale(1.05);
    border-color:rgba(56,189,248,.35);
    box-shadow:
        inset 0 0 12px rgba(255,255,255,.06),
        0 0 18px rgba(56,189,248,.22),
        0 8px 20px rgba(0,0,0,.55);
}

td span{
    position:relative;
    z-index:2;
}

/* REAL */
.p{color:var(--p);border:1px solid var(--p)}
.b{color:var(--b);border:1px solid var(--b)}
.t{color:var(--t);border:1px solid var(--t)}

/* GHOST */
.gp{color:var(--p);background:rgba(56,189,248,.18);border:1px dashed var(--p)}
.gb{color:var(--b);background:rgba(251,113,133,.18);border:1px dashed var(--b)}

/* BLINK SMALL BET */
.pending{
border:2px solid #facc15!important;
animation:glowBlink 1s infinite;
}

/* MARK */
.mark{
position:absolute;inset:0;
display:flex;align-items:center;justify-content:center;
font-size:22px;opacity:.35;pointer-events:none;
}
.ok{color:#22c55e}
.no{color:#ef4444}

.btn{

border-radius:16px;

font-weight:900;

border:none;

transition:.25s;

box-shadow:

0 8px 18px rgba(0,0,0,.45);

}

.btn:hover{

transform:translateY(-2px);

box-shadow:

0 12px 30px rgba(56,189,248,.28);

}
@keyframes floatGlow{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-3px);
}

100%{
transform:translateY(0);
}

}

.advice{

animation:floatGlow 3s ease-in-out infinite;

}
</style>
</head>

<body>

    <!-- LOGIN PAGE -->
    <div id="loginPage">

        <div id="login" class="login">
            <h3>AI ACCESS</h3>

            <input id="u" placeholder="USER">
            <input id="p" type="password" placeholder="PASSWORD">

            <button onclick="go()">LOGIN</button>

            <div id="m" class="text-danger text-center mt-2"></div>
        </div>

    </div>

<div id="app" class="app d-none">
<div class="header">AI QUANTUM PREDICTOR Monte Carlo Pattern Filter เงื่อนไขรัดกุม เน้นปลอดภัย หมุน 129,800 รอบ ผจก.Aggrassive ช่วยเลือกตัวแทง</div>
<div class="sub">Expiry : 23 กรกฎาคม พ.ศ. 2569</div>
<div id="expiredMsg" class="expired d-none">❌ โปรแกรมหมดอายุแล้ว</div>

<div class="acc">ACCURACY <span id="acc">0%</span></div>

<div id="adv" class="advice">WAIT</div>

<div class="stats">
<div style="color:var(--p)">P <span id="cp">0</span></div>
<div style="color:var(--b)">B <span id="cb">0</span></div>
<div style="color:var(--t)">T <span id="ct">0</span></div>
<div>TOTAL <span id="ca">0</span></div>
</div>

<table><tbody id="tb"></tbody></table>
<div class="row g-2 mt-3">

  <!-- แถวบน -->
  <div class="col-4">
    <button class="btn btn-info w-100 action" onclick="add('1')">P</button>
  </div>

  <div class="col-4">
    <button class="btn btn-danger w-100 action" onclick="add('2')">B</button>
  </div>

  <div class="col-4">
    <button class="btn btn-success w-100 action" onclick="add('0')">T</button>
  </div>

  <!-- แถวกลาง -->
  <div class="col-6">
    <button class="btn btn-secondary w-100 action" onclick="undo()">UNDO</button>
  </div>

  <div class="col-6">
    <button class="btn btn-warning w-100 action" onclick="ai()">
      AI สุ่มความแม่นยำสูงสุด
    </button>
  </div>

  <!-- Progress -->
  <div class="col-12 mt-2">
    <div class="progress" style="height:18px;">
      <div id="aiBar"
           class="progress-bar progress-bar-striped progress-bar-animated"
           style="width:0%">0%</div>
    </div>
  </div>

  <!-- RESET -->
  <div class="col-12">
    <button class="btn btn-dark w-100 action" onclick="reset()">RESET</button>
  </div>

</div>


<script>
const EXPIRY_DATE=new Date('2026-07-23T23:59:59'); // 23 กรกฎาคม พ.ศ. 2569
const R=6,C=13;

let h=[],g=[];
let lossCount = 0;
let antiMode = true;

let lastMode = null;

// ===== Dynamic Risk Dampener =====
let loseStreak = 0;
let riskLevel  = 1;   // 1 = เต็มแรง


function isExpired(){return new Date()>EXPIRY_DATE}
function go(){

    if(isExpired()){
        m.innerText='PROGRAM EXPIRED';
        return;
    }

    if(u.value==='1234'&&p.value==='1234'){

        document.getElementById("loginPage").classList.add("d-none");

        app.classList.remove("d-none");

    }else{

        m.innerText='ACCESS DENIED';

    }

}

function add(v){

  if(isExpired()) return;
  if(h.length >= R*C) return;

  // บันทึกผลจริงก่อน
  h.push(v);


// ===== อัปเดต lose streak =====
let lastIndex = h.length - 1;

if(g[lastIndex] !== undefined && v !== '0'){
   if(v === g[lastIndex]){
      loseStreak = 0;
      riskLevel = Math.min(riskLevel + 0.2, 1);  // ชนะ → ค่อยๆ ฟื้น
   }else{
      loseStreak++;
      if(loseStreak >= 2) riskLevel = 0.6;
      if(loseStreak >= 4) riskLevel = 0.4;
   }
}

  // 👉 สร้าง prediction ช่องถัดไปทันที
  let nextIndex = h.length;

if(g[nextIndex] === undefined){
   let reverseSignal = getReverseSignal();

   if(!reverseSignal){
      reverseSignal = Math.random() > .5 ? '1' : '2';
   }

   g[nextIndex] = reverseSignal;
}

  draw();

  // ให้ Monte Carlo คิดทับแบบ background
  setTimeout(() => ai(), 0);
}





function reset(){
  if(!isExpired()){
    h = [];
    g = [];

    const bar = document.getElementById("aiBar");
    if(bar){
      bar.style.width = "0%";
      bar.innerText = "0%";
    }

    draw();
  }
}

function undo(){
  if(isExpired()) return;
  if(h.length === 0) return;

  let lastIndex = h.length - 1;

  h.splice(lastIndex, 1);   // ลบผลจริงช่องนั้น
  g.splice(lastIndex, 1);   // ลบ prediction ช่องเดียวกัน

  draw();

  // สร้าง prediction ใหม่ของช่องปัจจุบัน
  setTimeout(() => ai(), 0);
}

function getLossStreak(){
   let streak = 0;

   for(let i = h.length - 1; i >= 0; i--){
      if(h[i] === '0') continue;
      if(g[i] === undefined) break;

      if(h[i] !== g[i]) streak++;
      else break;
   }

   return streak;
}

function getReverseSignal(){

   let recent = h.slice().reverse().find(x => x !== '0');

   if(!recent) return null;

   return recent === '1' ? '2' : '1';
}


async function ai(){

  if(isExpired()) return;

  let targetIndex = h.length;

  const TOTAL = 129800;
  const CHUNK = 300;


  const bar = document.getElementById("aiBar");

  // 🔴 แสดงตัวสวนทันที
  let reverseSignal = getReverseSignal();
  if(!reverseSignal){
     reverseSignal = Math.random() > .5 ? '1' : '2';
  }

  if(g[targetIndex] === undefined){
     g[targetIndex] = reverseSignal;
     draw();
  }

// 🔵 Monte Carlo
let scoreP = 0;
let scoreB = 0;
let matches = 0;

// ===== Dynamic Prefix (Ultra Stable) =====
let dynamicPrefix = 5;

if(riskLevel <= 0.6) dynamicPrefix = 4;
if(riskLevel <= 0.4) dynamicPrefix = 3;

let start = Math.max(0, h.length - dynamicPrefix);
let prefix = h.slice(start).filter(x => x !== '0');

// ===== Monte Carlo Loop =====
for(let t=0; t<TOTAL; t+=CHUNK){

  for(let k=0; k<CHUNK; k++){

    let ok = true;

    for(let i=0;i<prefix.length;i++){
      let r = Math.random() > .5 ? '1':'2';
      if(r !== prefix[i]){
        ok = false;
        break;
      }
    }

    if(ok){
      matches++;
      let next = Math.random() > .5 ? '1':'2';
      if(next === '1') scoreP++;
      else scoreB++;
    }
  }

  if(bar){
    let percent = Math.floor(t/TOTAL*100);
    bar.style.width = percent+"%";
    bar.innerText = percent+"%";
    await new Promise(r=>setTimeout(r,0));
  }
}

if(bar){
  bar.style.width="100%";
  bar.innerText="100%";
}

 
 // ===============================
// 🔵 AGGRESSIVE SMART MODE
// ===============================

let final;

// คำนวณ confidence จริง
let confidence = matches 
   ? Math.max(scoreP, scoreB) / matches 
   : 0;
   
// ===== Dynamic Confidence Cap =====
let cap = 0.65;

if(riskLevel <= 0.6) cap = 0.60;
if(riskLevel <= 0.4) cap = 0.57;

confidence = Math.min(confidence, cap);

// ฝั่งหลักจาก Monte Carlo
let mainSignal = scoreP > scoreB ? '1' : '2';

// ----------- โซนตัดสินใจ -----------

if(matches === 0){
   final = reverseSignal; // ไม่มี match = สวน
}
else if(confidence >= 0.54){
   // Edge เริ่มชัด → ตาม
   final = mainSignal;
}
else if(confidence >= 0.48){
   // โซนหลอก 48–54 → สวนทันที
   final = mainSignal === '1' ? '2' : '1';
}
else{
   // ต่ำกว่า 48 = bias ผิดฝั่งแรง → สวนแรง
   final = mainSignal === '1' ? '2' : '1';
}


// ===== Dynamic Risk Dampener (ปรับเนียนกว่าเดิม) =====
if(riskLevel < 1){

   // เสียระดับกลาง → ถ้า edge ไม่ชัด หันสวน
   if(riskLevel <= 0.6 && confidence < 0.54){
      final = reverseSignal;
   }

   // เสียหนัก → ต้องชัดจริงค่อยตาม
   if(riskLevel <= 0.4 && confidence >= 0.57){
      final = mainSignal;
   }
}

// ----------- Loss Guard -----------

let streak = getLossStreak();

if(streak >= 3 && riskLevel > 0.5 && confidence < 0.60){
   final = final === '1' ? '2' : '1';
}

// บันทึกผล
g[targetIndex] = final;
lastMode = final === mainSignal ? 'main' : 'reverse';
  draw();
}

function draw(){

tb.innerHTML='';
let win=0,total=0,p=0,b=0,ti=0;
let pending=h.length,blinkUsed=false;

adv.className='advice';

if(g[pending]){
   adv.innerText = g[pending]=='1'?'P':'B';
   adv.classList.add(g[pending]=='1'?'p':'b');
}
else if(h.length === 0){
   adv.innerText='WAIT';
}

for(let r=0;r<R;r++){
  let tr = document.createElement('tr');

  for(let c=0;c<C;c++){

    let i = c*R + r;
    let td = document.createElement('td');

    // ====== มีผลจริง ======
    if(h[i]){

      let s = document.createElement('span');

      if(h[i]=='1'){
          td.className='p';
          s.innerText='P';
          p++;
      }
      else if(h[i]=='2'){
          td.className='b';
          s.innerText='B';
          b++;
      }
      else{
          td.className='t';
          s.innerText='T';
          ti++;
      }

      td.appendChild(s);

      // คิด % เฉพาะ P/B
      if(h[i] !== '0' && g[i] !== undefined){

          total++;
          let ok = (h[i] === g[i]);
          if(ok) win++;

          td.innerHTML += `
            <div class="mark ${ok?'ok':'no'}">
              ${ok?'✓':'✕'}
            </div>
          `;
      }
    }

    // ====== Ghost Prediction ======
    else if(g[i]){

      td.className = g[i]=='1' ? 'gp' : 'gb';
      td.innerHTML = `<span>${g[i]=='1'?'P':'B'}</span>`;

      if(i===pending && !blinkUsed){
        td.classList.add('pending');
        blinkUsed = true;
      }
    }

    tr.appendChild(td);
  }

  tb.appendChild(tr);
}

acc.innerText = total ? Math.round(win/total*100)+'%' : '0%';
cp.innerText=p;
cb.innerText=b;
ct.innerText=ti;
ca.innerText=h.length;
}

function lockIfExpired(){

    if(isExpired()){

        expiredMsg.classList.remove("d-none");

        document.querySelectorAll(".action")
            .forEach(b=>b.disabled=true);

    }

}
draw();
lockIfExpired();

</script>
</div>
    <!-- END APP -->
</body>
</html>
